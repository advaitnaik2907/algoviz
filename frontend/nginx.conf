server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React Router: any URL (like /dashboard) must load index.html,
    # otherwise refreshing the page gives a 404 error.
    location / {
        try_files $uri /index.html;
    }

    # Built JS/CSS files have unique names, so browsers can cache them
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}