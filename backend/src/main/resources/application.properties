spring.application.name=backend

# ---------------------------------------------------------
# Load secrets from a local ".env" file if it exists
# (backend/.env on your computer). In Docker / Railway the
# same values come from real environment variables instead.
# ---------------------------------------------------------
spring.config.import=optional:file:./.env[.properties]

# ---------------------------------------------------------
# SERVER
# Railway tells the app which port to use through PORT.
# ---------------------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------------------
# DATABASE (MySQL)
# ---------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/algoviz_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------------------------------------------------------
# JPA / HIBERNATE
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------
# JWT
# JWT_SECRET must be at least 32 characters. No default on
# purpose: the app refuses to start without one.
# ---------------------------------------------------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------
# CORS
# Frontend addresses allowed to call this backend.
# Separate several addresses with commas, no trailing slash.
# ---------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
